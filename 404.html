<!DOCTYPE html>
<html lang="en" data-theme="sector">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#040711">
  <title>Signal Lost | Neon Sector-7</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="error-page">
  <div class="site-background" aria-hidden="true">
    <div class="ambient-light ambient-light-one"></div>
    <div class="ambient-light ambient-light-two"></div>
    <div class="grid-layer"></div>
    <div class="scanlines"></div>
    <div class="noise-layer"></div>
  </div>

  <main class="error-main">
    <div class="error-shell">
      <div class="error-mark" aria-hidden="true">A7</div>
      <p class="section-code">SIGNAL_LOST // SECTOR NOT FOUND</p>
      <p class="error-code" aria-hidden="true">404</p>
      <h1>Sector not found.</h1>
      <p>
        The transmission you requested does not exist or has moved beyond the
        current relay network.
      </p>
      <a class="button button-primary" href="/">
        <span>Return to Neon Sector-7</span>
        <span class="button-arrow" aria-hidden="true">↖</span>
      </a>
      <small>CONNECTION READY // PRIMARY CHANNEL AVAILABLE</small>
    </div>
  </main>
</body>
</html>
