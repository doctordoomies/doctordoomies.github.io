<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Adam's interactive Neon Sector-7 developer portfolio."
  >

  <title>Adam | Neon Sector-7</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;

      color: #eafcff;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(0, 229, 255, 0.15),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(123, 97, 255, 0.18),
          transparent 40%
        ),
        #030711;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(0, 229, 255, 0.04) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0, 229, 255, 0.04) 1px,
          transparent 1px
        );

      background-size: 40px 40px;
      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 20%,
          black 80%,
          transparent
        );
    }

    .interface {
      position: relative;
      width: min(900px, calc(100% - 40px));
      padding: 60px 40px;
      text-align: center;

      border: 1px solid rgba(0, 229, 255, 0.55);

      background:
        linear-gradient(
          135deg,
          rgba(4, 14, 30, 0.92),
          rgba(8, 5, 25, 0.92)
        );

      box-shadow:
        0 0 25px rgba(0, 229, 255, 0.22),
        0 0 80px rgba(123, 97, 255, 0.15),
        inset 0 0 35px rgba(0, 229, 255, 0.05);

      clip-path:
        polygon(
          30px 0,
          100% 0,
          100% calc(100% - 30px),
          calc(100% - 30px) 100%,
          0 100%,
          0 30px
        );
    }

    .status {
      margin: 0 0 18px;
      color: #00e5ff;
      font-family: Consolas, monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(3rem, 10vw, 7rem);
      letter-spacing: 0.08em;
      line-height: 1;

      color: #eefcff;

      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.75),
        0 0 25px rgba(0, 229, 255, 0.8),
        0 0 55px rgba(123, 97, 255, 0.65);
    }

    .subtitle {
      margin: 24px 0 10px;
      color: #9c8cff;

      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .message {
      max-width: 640px;
      margin: 24px auto 0;

      color: #a9c6d3;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .loading {
      width: min(420px, 90%);
      height: 7px;
      margin: 36px auto 14px;
      overflow: hidden;

      border: 1px solid rgba(0, 229, 255, 0.5);
      background: rgba(0, 229, 255, 0.06);
    }

    .loading::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          #00e5ff,
          #7b61ff
        );

      box-shadow:
        0 0 20px #00e5ff;

      animation: loading 2.2s ease-in-out infinite;
    }

    .loading-label {
      color: #668a9a;
      font-family: Consolas, monospace;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    @keyframes loading {
      0% {
        transform: translateX(-110%);
      }

      100% {
        transform: translateX(240%);
      }
    }
  </style>
</head>

<body>
  <main class="interface">
    <p class="status">
      &gt; System initialization successful
    </p>

    <h1>ADAM</h1>

    <p class="subtitle">
      AI • Game Development • Minecraft • Three.js
    </p>

    <p class="message">
      Welcome to Neon Sector-7—an interactive developer portfolio
      built around games, artificial intelligence, 3D worlds,
      creative technology, and everything I build next.
    </p>

    <div class="loading" aria-hidden="true"></div>

    <p class="loading-label">
      Preparing cinematic interface...
    </p>
  </main>
</body>
</html>
